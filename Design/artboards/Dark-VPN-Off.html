<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RouteSentry · VPN Off Only</title><style>
@font-face { font-family:Geist;src:url(assets/Geist.woff2) format('woff2');font-weight:100 900; }

header { display:grid;grid-template-columns:32px 1fr 32px;align-items:center;height:55px;flex:none;padding:0 20px; }

.row { display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0;border-bottom:1px solid #282828;color:#ededed;text-decoration:none;font-weight:570; }
.content > .row:last-child { border-bottom:0; }

a.row:hover .row-end { color:#ededed; }
.row-end { display:flex;align-items:center;gap:8px;margin-left:auto;color:#ababab;font-size:12px;font-weight:450; }
.row-end svg { flex:none; }
.row > svg, h1 > svg { flex:none;color:#d0d0d0; }
.muted { color:#ababab;font-size:12px; }
.row-description { display:flex;min-width:0;flex-direction:column;gap:3px; }
.row-description .muted { font-weight:450;line-height:1.35; }
.row-description + .row-end { flex-shrink:0;max-width:110px;text-align:right; }
.button { min-height:38px;padding:0 12px;border:1px solid #4c4c4c;border-radius:8px;background:#111;color:#ededed;font-size:12px;font-weight:580;white-space:nowrap; }
.button:hover:not(:disabled) { filter:brightness(1.18); }
.button-primary { background:#f5f5f5;border-color:#f5f5f5;color:#151515; }
.button-primary:hover:not(:disabled) { filter:brightness(.88); }
.configuration-button { display:inline-flex;flex:none;align-items:center;justify-content:center;width:100px;min-height:34px;padding:0 9px;border-color:#383838;background:#101010;text-decoration:none; }

.add-domain { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:43px;font-size:13px; }

#launch-at-login:checked::after { transform:translateX(15px);background:#171717; }
.profile-option { cursor:pointer; }
.profile-option input { appearance:none;width:16px;height:16px;margin:0 0 0 auto;border:1px solid #767676;border-radius:50%;cursor:pointer; }
.profile-option input:checked { border:5px solid #ededed; }
</style></head><body>
<main style="width:390px;height:740px" data-rule="not_vpn_only">
  <header>
    <a class="back" href="artboards/Dark-Settings.html" aria-label="Back to Settings" title="Back to Settings"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></a>
    <h1><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.5 16.2 4.9 7.2 17.3 4 14.4V7zM18 5.9 20 7v7.4l-8 7.1-3.3-2.9z"/></svg>VPN Off Only</h1>
  </header>

  <section class="content rule-content" aria-label="Saved addresses">
    <p class="muted">These addresses are blocked while the VPN is connected.</p>
    <div id="not_vpn_only-chips" class="chips" data-jc-opaque data-jc-label="Removable address chips"></div>
    <p id="not_vpn_only-empty" class="muted empty-list">No addresses yet.</p>
  </section>
  <footer class="rule-footer">
    <button id="not_vpn_only-open" class="button button-primary add-domain" type="button" aria-controls="not_vpn_only-form" aria-expanded="false"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v12M6 12h12"/></svg>Add Domain</button>
    <form id="not_vpn_only-form" hidden>
      <div class="address-entry">
        <input id="not_vpn_only-input" type="text" aria-label="Addresses" placeholder="intranet.example.net" autocomplete="off" spellcheck="false" aria-invalid="false" aria-describedby="not_vpn_only-feedback">
        <button id="not_vpn_only-add" class="button button-primary" type="submit" disabled>Save</button>
      </div>
      <p id="not_vpn_only-feedback" class="muted feedback" aria-live="polite"></p>
    </form>
  </footer>
</main>
<script>const byId = id => document.getElementById(id);
const keys = ['vpn_only', 'not_vpn_only'];
const titles = {vpn_only: 'VPN On Only', not_vpn_only: 'VPN Off Only'};
const profiles = {auto: 'Automatic', route: 'Routed tunnel'};
const session = window.jc?.session ?? {};
const sample = {vpn_only: ['example.com', 'api.example.com', 'status.example.com', '203.0.113.0/24'], not_vpn_only: ['intranet.example.net', 'printer.example.net', '192.0.2.10']};
const saved = session.routeRules ?? sample;
const lists = {vpn_only: saved.vpn_only.map(address), not_vpn_only: saved.not_vpn_only.map(address)};

function address(token) {
  const [host, bits, extra] = token.split('/');
  if (extra !== undefined || (bits !== undefined && !/^\d{1,3}$/.test(bits))) return null;
  let ip = null;
  const v4 = host.split('.');
  if (v4.length === 4 && v4.every(part => /^(0|[1-9]\d{0,2})$/.test(part) && Number(part) < 256)) {
    ip = {version: 4, canonical: v4.join('.'), value: v4.reduce((value, part) => (value << 8n) + BigInt(part), 0n)};
  } else if (/^[\da-f:.]+$/i.test(host) && host.includes(':')) {
    try {
      const canonical = new URL(`http://[${host}]/`).hostname.slice(1, -1);
      const halves = canonical.split('::');
      const left = halves[0] ? halves[0].split(':') : [];
      const right = halves[1] ? halves[1].split(':') : [];
      const groups = halves.length === 1 ? left : [...left, ...Array(8 - left.length - right.length).fill('0'), ...right];
      ip = {version: 6, canonical, value: groups.reduce((value, part) => (value << 16n) + BigInt(`0x${part}`), 0n)};
    } catch { return null; }
  }
  if (ip) {
    const width = ip.version === 4 ? 32 : 128;
    const prefix = bits === undefined ? width : Number(bits);
    if (prefix > width) return null;
    const span = 1n << BigInt(width - prefix);
    if (ip.value % span !== 0n) return null;
    return {text: bits === undefined ? ip.canonical : `${ip.canonical}/${prefix}`,
      kind: ip.version, first: ip.value, last: ip.value + span - 1n};
  }
  if (bits !== undefined || /[\x00-\x20*%?#@:\[\]\\]/.test(host)) return null;
  try {
    const domain = new URL(`http://${host}/`).hostname.toLowerCase().replace(/\.$/, '');
    const labels = domain.split('.');
    if (domain.length > 253 || labels.length < 2 || /^\d+$/.test(labels.at(-1))
      || labels.some(label => !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(label))) return null;
    return {text: domain, kind: 'domain'};
  } catch { return null; }
}

function exactMatch(a, b) {
  if (a.kind !== b.kind) return false;
  return a.kind === 'domain' ? a.text === b.text : a.first === b.first && a.last === b.last;
}

function overlaps(a, b) {
  if (a.kind !== b.kind) return false;
  return a.kind === 'domain' ? a.text === b.text : a.first <= b.last && b.first <= a.last;
}

function validate(token, current, opposite, oppositeTitle) {
  if (token.includes('://')) return {error: `Use the domain only for “${token}”.`};
  const entry = address(token);
  if (!entry) return {error: `“${token}” is not a valid domain, IP, or CIDR.`};
  if (current.some(item => exactMatch(item, entry))) return {error: `“${entry.text}” is already in this list.`};
  const conflict = opposite.find(item => overlaps(item, entry));
  if (conflict) return {error: `“${entry.text}” overlaps “${conflict.text}” in ${oppositeTitle}.`};
  return {entry};
}

function markEdited() {
  session.routeRules = Object.fromEntries(keys.map(key => [key, lists[key].map(entry => entry.text)]));
}

function render(key) {
  const chips = byId(`${key}-chips`);
  chips.replaceChildren();
  for (const entry of lists[key]) {
    const chip = document.createElement('span');
    chip.setAttribute('style', 'display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;height:31px;padding:0 4px 0 10px;border:1px solid #353535;border-radius:8px;box-sizing:border-box');
    const label = document.createElement('span');
    label.textContent = entry.text;
    label.title = entry.text;
    label.setAttribute('style', 'font:12px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap');
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.setAttribute('aria-label', `Remove ${entry.text}`);
    remove.setAttribute('style', 'width:22px;height:22px;flex:none;padding:0;border:0;border-radius:4px;background:transparent;color:#dedede;font:18px/1 system-ui;cursor:pointer');
    remove.textContent = '×';
    remove.addEventListener('mouseenter', () => { remove.style.background = '#414141'; });
    remove.addEventListener('mouseleave', () => { remove.style.background = 'transparent'; });
    remove.addEventListener('click', () => {
      lists[key] = lists[key].filter(item => item !== entry);
      render(key);
      markEdited();
      const focusTarget = byId(`${key}-form`).hidden ? 'open' : 'input';
      byId(`${key}-${focusTarget}`).focus();
    });
    chip.append(label, remove);
    chips.append(chip);
  }
  byId(`${key}-empty`).hidden = lists[key].length !== 0;
}

function feedback(key, message, isError) {
  const field = byId(`${key}-input`);
  const line = byId(`${key}-feedback`);
  line.textContent = message;
  line.style.color = isError ? '#ededed' : '#a3a3a3';
  field.setAttribute('aria-invalid', String(isError));
  field.style.borderColor = isError ? '#b5b5b5' : '#4c4c4c';
}

function setEditorOpen(key, open) {
  const opener = byId(`${key}-open`);
  const field = byId(`${key}-input`);
  opener.hidden = open;
  opener.setAttribute('aria-expanded', String(open));
  byId(`${key}-form`).hidden = !open;
  if (!open) {
    field.value = '';
    byId(`${key}-add`).disabled = true;
    feedback(key, '', false);
  }
  (open ? field : opener).focus();
}

function setupRules(key) {
  const other = keys.find(candidate => candidate !== key);
  const field = byId(`${key}-input`);
  const add = byId(`${key}-add`);
  const form = byId(`${key}-form`);
  byId(`${key}-open`).addEventListener('click', () => setEditorOpen(key, true));
  form.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    event.preventDefault();
    event.stopPropagation();
    setEditorOpen(key, false);
  });
  function toggleAdd() { add.disabled = !field.value.trim(); }
  field.addEventListener('input', () => { feedback(key, '', false); toggleAdd(); });
  field.addEventListener('paste', event => {
    const pasted = event.clipboardData.getData('text');
    if (!/[\r\n\t]/.test(pasted)) return;
    event.preventDefault();
    field.setRangeText(pasted.replace(/[\r\n\t]+/g, ' '), field.selectionStart, field.selectionEnd, 'end');
    toggleAdd();
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    const tokens = field.value.split(/[\s,;]+/).filter(Boolean);
    if (!tokens.length) return;
    const rejected = [];
    let added = 0;
    for (const token of tokens) {
      const result = validate(token, lists[key], lists[other], titles[other]);
      if (result.error) rejected.push({token, message: result.error});
      else { lists[key].push(result.entry); added += 1; }
    }
    field.value = rejected.map(item => item.token).join(', ');
    if (added) { render(key); markEdited(); }
    if (!rejected.length) {
      setEditorOpen(key, false);
      return;
    }
    const prefix = added ? `Added ${added}. ` : '';
    const remaining = rejected.length > 1 ? ` +${rejected.length - 1} more.` : '';
    feedback(key, prefix + rejected[0].message + remaining, true);
    toggleAdd();
    field.focus();
  });
  render(key);
}

setupRules(document.querySelector('main').dataset.rule);
</script></body></html>
