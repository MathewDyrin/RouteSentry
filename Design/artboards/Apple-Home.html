<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RouteSentry</title><style>body { margin: 0; } input::placeholder { color:#747d8b; } button:disabled { opacity:.47; cursor:default; } [hidden] { display:none !important; }</style></head><body>

<main style="width:440px;height:510px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;border:1px solid #c4cbd6;border-radius:16px;background:linear-gradient(158deg,#fbfcff 18%,#f4f7fd 65%,#eff4fb);color:#172334;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:0 17px;height:48px;flex:none;border-bottom:1px solid #e7ebf1;background:#ffffffb8">
    <div aria-hidden="true" style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border:1px solid #e9554e;border-radius:50%;background:#ff615a;box-sizing:border-box"></span><span style="width:11px;height:11px;border:1px solid #dfa434;border-radius:50%;background:#ffbd2e;box-sizing:border-box"></span><span style="width:11px;height:11px;border:1px solid #26ac44;border-radius:50%;background:#28c840;box-sizing:border-box"></span></div>
    <a href="artboards/Apple-Settings.html" style="display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;height:29px;border:1px solid #c8ccd4;border-radius:7px;background:linear-gradient(#ffffff,#f7f8fa);color:#253142;box-shadow:0 1px 1px #202d4010;font:500 12px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;box-sizing:border-box;text-decoration:none;white-space:nowrap" jc-focus="outline:3px solid #6ca8ff;outline-offset:2px" jc-hover="background:#eff4fb"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4l.4 2.2 1.5.9 2.1-.7 2 3.5-1.7 1.5v1.8l1.7 1.5-2 3.5-2.1-.7-1.5.9L14 20h-4l-.4-2.2-1.5-.9-2.1.7-2-3.5 1.7-1.5v-1.8L4 9.3l2-3.5 2.1.7 1.5-.9L10 3Zm5 8.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg><span>Settings</span></a>
  </header>
  <section style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:0 34px;gap:24px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
      <img src="assets/icon.png" alt="" style="width:42px;height:42px">
      <h1 style="font-size:21px;font-weight:680;letter-spacing:-.48px;margin:0">RouteSentry</h1>
    </div>
    <div id="power-ring" style="width:158px;height:158px;border:1px solid #e2eaf7;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf3fc;box-sizing:border-box">
      <button id="power" type="button" aria-label="Turn On Protection" aria-pressed="false" style="display:grid;place-items:center;width:132px;height:132px;box-sizing:border-box;padding:0;border-radius:50%;border:1px solid #d2e0f4;background:linear-gradient(155deg,#ffffff,#eaf1fb);color:#1667c7;box-shadow:0 9px 28px #174c8b18,inset 0 1px 1px #ffffff;cursor:pointer" jc-focus="outline:3px solid #6ca8ff;outline-offset:2px" jc-hover="filter:brightness(.97)" jc-active="transform:scale(.97)"><svg aria-hidden="true" width="51" height="51" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8m5.1-5.1a8 8 0 1 1-10.2 0"/></svg></button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:8px"><span id="status-dot" aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:#8290a2"></span><h2 id="protection-status" aria-live="polite" style="font-size:24px;line-height:1.2;letter-spacing:-.55px;font-weight:650;margin:0">Protection Off</h2></div>
      <p id="protection-hint" style="margin:0;font-size:13px;color:#586576">Click the power button to turn it on.</p>
    </div>
  </section>
  <footer style="padding:0 24px 20px">
    <div style="display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #dce3ed;border-radius:10px;background:#ffffffab">
      <span aria-hidden="true" style="width:28px;height:28px;display:grid;place-items:center;background:#eaf1fd;color:#1a63bd;border-radius:7px"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.8a3.8 3.8 0 0 0 5.3 0l3.3-3.3a3.8 3.8 0 0 0-5.3-5.3l-1.4 1.4m2.1 3.6a3.8 3.8 0 0 0-5.3 0l-3.3 3.3a3.8 3.8 0 0 0 5.3 5.3l1.4-1.4"/></svg></span>
      <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:11px;color:#5f6979">VPN source</span><span style="font-size:13px;font-weight:620">Sota Connect</span></div>
      <span style="margin-left:auto;font-size:11px;color:#17683a;font-weight:560;display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;background:#2caa58;border-radius:50%"></span>Connected</span>
    </div>
  </footer>
</main>
<script>const session = window.jc?.session ?? {};
const power = document.getElementById('power');
const status = document.getElementById('protection-status');
const hint = document.getElementById('protection-hint');
const indicator = document.getElementById('status-dot');
const ring = document.getElementById('power-ring');
let enabled = !!session.routeProtection;
function render() {
  power.setAttribute('aria-label', enabled ? 'Turn Off Protection' : 'Turn On Protection');
  power.setAttribute('aria-pressed', String(enabled));
  power.title = enabled ? 'Turn Off Protection' : 'Turn On Protection';
  power.style.background = enabled ? 'linear-gradient(155deg,#3494ff,#075ae0)' : 'linear-gradient(155deg,#ffffff,#eaf1fb)';
  power.style.color = enabled ? '#ffffff' : '#1667c7';
  power.style.borderColor = enabled ? '#1467db' : '#d2e0f4';
  power.style.boxShadow = enabled ? '0 9px 30px #187bff45,inset 0 1px 1px #ffffff66' : '0 9px 28px #174c8b18,inset 0 1px 1px #ffffff';
  ring.style.background = enabled ? '#e1efff' : '#edf3fc';
  ring.style.borderColor = enabled ? '#b8d6ff' : '#e2eaf7';
  indicator.style.background = enabled ? '#26a653' : '#8290a2';
  status.textContent = enabled ? 'Protection On' : 'Protection Off';
  hint.textContent = enabled ? 'Your address rules are active.' : 'Click the power button to turn it on.';
}
power.addEventListener('click', () => { enabled = !enabled; session.routeProtection = enabled; render(); });
render();
</script>
</body></html>
