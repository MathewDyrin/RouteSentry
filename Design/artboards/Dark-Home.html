<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RouteSentry · Protection</title><style>

#toggle-protection { background:#f5f5f5;border-color:#f5f5f5;color:#151515; }
#toggle-protection[aria-pressed="true"] { background:#161616;border-color:#373737;color:#f5f5f5; }

 <section style="flex:1;display:flex;min-height:0;flex-direction:column;gap:24px;padding:0 24px 24px">

   <span style="display:flex;align-items:center;gap:5px;margin-left:auto;color:#bdbdbd;font-size:11px"><span aria-hidden="true" style="width:5px;height:5px;border-radius:50%;background:#bdbdbd"></span>Connected</span>

    <div style="display:flex;align-items:baseline;gap:6px;color:#f5f5f5"><strong id="not_vpn_only-domains" style="font-size:32px;line-height:1;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-1px">2</strong><span id="not_vpn_only-unit" style="font-size:12px;color:#bdbdbd">domains</span></div>

    </div>
  </div>
  <button id="toggle-protection" type="button" aria-pressed="false" style="min-height:43px;padding:0 12px;border:1px solid;border-radius:8px;font:580 13px Geist,system-ui,sans-serif;cursor:pointer" jc-focus="outline:2px solid #ededed;outline-offset:3px" jc-hover="filter:brightness(.88)">Enable Protection</button>
 </section>
</main>
<script>const session = window.jc?.session ?? {};
const button = document.getElementById('toggle-protection');
const status = document.getElementById('protection-status');
const subtitle = document.getElementById('protection-detail');
const main = document.querySelector('main');
const sample = {
  vpn_only: ['example.com', 'api.example.com', 'status.example.com', '203.0.113.0/24'],
  not_vpn_only: ['intranet.example.net', 'printer.example.net', '192.0.2.10'],
};
let enabled = !!session.routeProtection;
function drawCounts() {
  const rules = session.routeRules ?? sample;
  for (const key of ['vpn_only','not_vpn_only']) {
    const entries = rules[key];
    const domains = entries.filter(value => !value.includes(':') && !value.includes('/') && !/^\d+(?:\.\d+){3}$/.test(value)).length;
    document.getElementById(key+'-domains').textContent = String(domains);
    document.getElementById(key+'-unit').textContent = domains === 1 ? 'domain' : 'domains';
    const networks = entries.length - domains;
    const remainder = document.getElementById(key+'-ips');
    remainder.hidden = networks === 0;
    remainder.textContent = networks === 1 ? '+ 1 IP or range' : `+ ${networks} IPs or ranges`;
  }
}
function drawProtection() {
  button.textContent = enabled ? 'Disable Protection' : 'Enable Protection';
  button.setAttribute('aria-pressed',String(enabled));
  main.dataset.protection = enabled ? 'on' : 'off';
  status.textContent = enabled ? 'Protection On' : 'Protection Off';
  subtitle.textContent = enabled ? 'Rules are active' : 'Rules are paused';
}
button.addEventListener('click', () => {
  enabled = !enabled;
  session.routeProtection = enabled;
  drawProtection();
});
drawCounts();
drawProtection();
</script></body></html>
